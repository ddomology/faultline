name: Publish notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout pinned Quartz 4.5.2
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: d25a6eabf96751ffca56f8a8139272def7a65041
          path: _quartz
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: _quartz/package-lock.json
      - name: Prepare notes and configuration
        run: node scripts/prepare-quartz.mjs
      - name: Install Quartz
        working-directory: _quartz
        run: npm ci
      - name: Index Obsidian notes
        run: node scripts/build-note-index.mjs
      - name: Render notes
        working-directory: _quartz
        run: npx quartz build
      - name: Connect labs to rendered notes
        run: node scripts/build-lab-catalog.mjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
