name: Publish Faultline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-site
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react-site/package-lock.json
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
        working-directory: .
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/retain-assets.mjs
      - run: npm run check:static
      - name: Keep deployable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: faultline-site-snapshot
          path: react-site/dist/
          include-hidden-files: true
          retention-days: 30
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
