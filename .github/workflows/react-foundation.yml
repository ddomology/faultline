name: Check React foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-site
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react-site/package-lock.json
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
        working-directory: .
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:static
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-browser-traces
          path: react-site/test-results/
          retention-days: 7
      - name: Check a renamed repository base
        env:
          FAULTLINE_BASE_PATH: /preview/faultline/
        run: |
          npm run build
          npm run check:static
          npm run test:browser -- --grep "client navigation"
